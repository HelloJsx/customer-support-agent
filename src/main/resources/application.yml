server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: customer-support-agent
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:deepseek-chat}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-base-url: ${AI_EMBEDDING_BASE_URL:}
    embedding-api-key: ${AI_EMBEDDING_API_KEY:}
    temperature: 0.2
    timeout: 60s
    max-retries: 2
    log-requests: false
  rag:
    vector-store: ${RAG_VECTOR_STORE:none}
    dimension: ${RAG_DIMENSION:1536}
    top-k: 4
    min-score: 0.5
    knowledge-path: knowledge
  agent:
    reviewer-enabled: true
    seed-demo-data: true
  memory:
    store: ${MEMORY_STORE:in-memory}
    max-messages: 20
    ttl: 24h

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.support.agent: INFO
    dev.langchain4j: INFO
